[project]
name = "tts-id-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rizky Milan Alpasya Wijaksono", email = "35473345+rmaw22@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
    "omnivoice>=0.2.1",
    "piper-tts>=1.8.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "supertonic>=1.3.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
tts-id-bench = "tts_id_bench:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
